<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Bäckerei Sonnenschein</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #fcf9f2;
            color: #333;
        }
        h1 {
            color: #d35400;
        }
        .status-banner {
            padding: 15px;
            margin-bottom: 30px;
            font-weight: bold;
            color: white;
            border-radius: 5px;
            text-align: center;
        }
        .open {
            background-color: #27ae60;
        }
        .closed {
            background-color: #c0392b;
        }
        .product-container {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }
        .product {
            background-color: white;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            width: 200px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            background-color: #d35400;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover {
            background-color: #e67e22;
        }
        .cart {
            background-color: white;
            border: 2px solid #d35400;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>

    <h1>Bäckerei Sonnenschein</h1>
    
    <div id="store-status" class="status-banner">Wird geladen...</div>

    <h2>Frisch aus dem Ofen</h2>
    
    <div class="product-container">
        <div class="product">
            <h3>Buttercroissant</h3>
            <p>Preis: 2.50 €</p>
            <button onclick="addToCart('Buttercroissant', 2.50)">In den Warenkorb</button>
        </div>
        <div class="product">
            <h3>Roggenbrot</h3>
            <p>Preis: 4.20 €</p>
            <button onclick="addToCart('Roggenbrot', 4.20)">In den Warenkorb</button>
        </div>
        <div class="product">
            <h3>Apfelstrudel</h3>
            <p>Preis: 3.80 €</p>
            <button onclick="addToCart('Apfelstrudel', 3.80)">In den Warenkorb</button>
        </div>
    </div>

    <div class="cart">
        <h2>Dein Einkaufswagen</h2>
        <ul id="cart-items"></ul>
        <p><strong>Gesamtsumme: <span id="total-price">0.00</span> €</strong></p>
    </div>

    <script>
        function checkOpenStatus() {
            const currentHour = new Date().getHours();
            const statusElement = document.getElementById('store-status');
            
            if (currentHour >= 8 && currentHour < 18) {
                statusElement.textContent = "Wir haben geöffnet! (8:00 - 18:00 Uhr)";
                statusElement.className = "status-banner open";
            } else {
                statusElement.textContent = "Wir haben derzeit geschlossen. (Öffnungszeiten: 8:00 - 18:00 Uhr)";
                statusElement.className = "status-banner closed";
            }
        }

        let cart = [];
        let total = 0;

        function addToCart(productName, productPrice) {
            cart.push({name: productName, price: productPrice});
            total += productPrice;
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsElement = document.getElementById('cart-items');
            const totalElement = document.getElementById('total-price');
            
            cartItemsElement.innerHTML = '';
            
            cart.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item.name + " - " + item.price.toFixed(2) + " €";
                cartItemsElement.appendChild(li);
            });
            
            totalElement.textContent = total.toFixed(2);
        }

        checkOpenStatus();
    </script>
</body>
</html>
